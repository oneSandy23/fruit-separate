<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水果分裝箱</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--text:#2b2a33;--muted:#6b6878;--a:#e8594f;--a-bg:#ffe3df;--b:#2f7fd1;--b-bg:#dcebfb;--ok:#2e9b57;--bad:#d9822b;--line:#e6dcc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--card:#2a2733;--text:#f3f0fa;--muted:#b0abc2;--a:#ff8a80;--a-bg:#4a2b2d;--b:#7ab6f5;--b-bg:#25384f;--ok:#58c98a;--bad:#f0a85a;--line:#3d394c}}
:root[data-theme="dark"]{--bg:#1d1b24;--card:#2a2733;--text:#f3f0fa;--muted:#b0abc2;--a:#ff8a80;--a-bg:#4a2b2d;--b:#7ab6f5;--b-bg:#25384f;--ok:#58c98a;--bad:#f0a85a;--line:#3d394c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:4px 0 2px;text-align:center}
.step{text-align:center;color:var(--muted);margin:0 0 12px;font-size:1.05rem}
.tray,.box{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:10px;min-height:96px}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-bottom:12px}
.tray .lbl{width:100%;text-align:center;color:var(--muted);font-size:.9rem}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border-style:solid;border-width:3px;display:flex;flex-direction:column;gap:8px}
.box.a{border-color:var(--a);background:var(--a-bg)}
.box.b{border-color:var(--b);background:var(--b-bg)}
.box h2{margin:0;font-size:1.1rem;text-align:center}
.box.a h2{color:var(--a)}.box.b h2{color:var(--b)}
.apples{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:56px;align-content:flex-start}
.ap{font-size:2rem;line-height:1;background:none;border:0;padding:2px;cursor:pointer;border-radius:10px}
.ap:active{transform:scale(.85)}
.add{font-size:1.1rem;padding:10px;border-radius:12px;border:0;color:#fff;cursor:pointer;font-weight:700}
.a .add{background:var(--a)}.b .add{background:var(--b)}
.add:disabled{opacity:.35;cursor:default}
.count{text-align:center;font-size:.95rem;color:var(--muted)}
.lid{font-size:4rem;text-align:center;padding:14px 0;cursor:pointer;border:0;background:none;width:100%}
.lid small{display:block;font-size:.95rem;color:var(--muted);margin-top:4px}
.big{display:block;margin:16px auto 0;font-size:1.2rem;padding:14px 26px;border-radius:999px;border:0;background:var(--ok);color:#fff;font-weight:700;cursor:pointer}
.big:disabled{opacity:.35;cursor:default}
.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);font-size:1rem;padding:10px 18px}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:420px;margin:10px auto}
.pad button{font-size:1.4rem;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:700}
.pad button.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.msg{text-align:center;font-size:1.2rem;font-weight:700;min-height:1.8em;margin:8px 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.eq{background:var(--card);border-radius:16px;padding:12px;text-align:center;font-size:1.5rem;font-weight:700;line-height:1.9;margin-top:10px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.setup{display:flex;gap:10px;justify-content:center;align-items:center;margin:0 0 12px;font-size:1.1rem;font-weight:700}
.setup button{width:44px;height:44px;font-size:1.5rem;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:700}
.setup span b{font-size:1.5rem;display:inline-block;min-width:1.6em;text-align:center}
.zc{display:inline-flex;align-items:center;white-space:nowrap;margin:0 1px;line-height:1.3}
.zz{display:inline-grid;grid-template-columns:auto auto;align-items:center;font-size:.4em;font-weight:500;line-height:1;margin-left:1px;opacity:.9}
.zn{grid-column:1;grid-row:1;text-align:center;line-height:.8}
.zl{grid-column:1;grid-row:2;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:0}
.zt{grid-column:2;grid-row:2;padding-left:1px;align-self:center}
body{line-height:1.6}
#fsel{flex-wrap:wrap}
.setup button.fb{width:auto;height:auto;border-radius:999px;font-size:1.05rem;padding:8px 14px;line-height:1.4}
.setup button.fb.on{background:var(--ok);color:#fff;border-color:var(--ok)}
h1,.step,.msg,.count,.lbl{line-height:1.9}
.msg{min-height:3em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 id="ttl"></h1>
<p class="step" id="step"></p>

<div class="setup" id="fsel"></div>
<div class="setup" id="setup"><span id="tl">蘋果總數</span><button id="minus" aria-label="減少">－</button><span><b id="tot">10</b> 顆</span><button id="plus" aria-label="增加">＋</button></div>
<div class="tray" id="tray"></div>
<div class="boxes">
  <div class="box a" id="boxA"></div>
  <div class="box b" id="boxB"></div>
</div>

<div id="guess" hidden>
  <p class="msg" id="msg"></p>
  <div id="padWrap" hidden>
    <div class="pad" id="pad"></div>
    <button class="big" id="check">確定</button>
  </div>
  <div class="eq" id="eq" hidden></div>
</div>

<div class="row"><button class="big" id="main" disabled></button><button class="big ghost" id="reset">重新開始</button></div>
</main>

<script>
let TOTAL=10,pi=0,fi=0;
const FRUITS=[['蘋果','🍎'],['橘子','🍊'],['芭樂','🍐'],['葡萄','🍇']];
const FN=()=>FRUITS[fi][0],FE=()=>FRUITS[fi][1];
const PRAISE=['太厲害了！🌟','你是{F}小天才！{E}','哇～你的腦袋閃閃發光！✨','答對囉！送你一個大拇指 👍','你比{F}還甜、還聰明！😋','{F}箱偵探就是你！🕵️','好棒好棒，大家鼓鼓掌！👏','數學小超人出現了！🦸','咻～一次就猜中！🚀','今天的{F}王就是你！👑'];
let st;
const $=id=>document.getElementById(id);
function init(){st={phase:'pack',tray:TOTAL,a:0,b:0,open:null,pick:null,done:false};render()}

function render(){
  const p=st.phase, trayEl=$('tray'), main=$('main');
  $('guess').hidden=p!=='guess';$('setup').hidden=p!=='pack';$('tot').textContent=TOTAL;
  $('ttl').textContent=FE()+' '+FN()+'分裝箱';$('tl').textContent=FN()+'總數';
  $('fsel').hidden=p!=='pack';
  $('fsel').innerHTML='<span>選水果</span>'+FRUITS.map((f,i)=>'<button class="fb'+(i===fi?' on':'')+'" data-i="'+i+'">'+f[1]+' '+f[0]+'</button>').join('');
  $('fsel').querySelectorAll('button').forEach(b=>b.onclick=()=>{fi=+b.dataset.i;init()});
  trayEl.hidden=p!=='pack';
  if(p==='pack'){
    $('step').textContent='第一位小朋友：把 '+TOTAL+' 顆'+FN()+'分到兩個箱子裡，想怎麼分都可以！';
    trayEl.innerHTML='<div class="lbl">盤子裡還有 '+st.tray+' 顆'+FN()+'</div>'+Array.from({length:st.tray},()=>'<span class="ap">'+FE()+'</span>').join('');
    boxPack('A','紅色箱子',st.a);boxPack('B','藍色箱子',st.b);
    main.hidden=false;main.disabled=st.tray!==0;main.textContent='蓋起來，交給下一位 ➜';main.onclick=()=>{st.phase='guess';render()};
  }else{
    $('step').textContent=st.open?'第二位小朋友：另一個箱子裡有幾顆'+FN()+'？':'第二位小朋友：點一個箱子，打開來看看！';
    boxGuess('A','紅色箱子',st.a);boxGuess('B','藍色箱子',st.b);
    $('padWrap').hidden=!st.open||st.done;
    $('eq').hidden=!st.done;
    main.hidden=true;
    if(st.open&&!st.done)drawPad();
    if(st.done)drawEq();
  }
}
function boxPack(k,name,n){
  const el=$('box'+k);
  el.innerHTML='<h2>'+name+'</h2><div class="apples">'+Array.from({length:n},()=>'<button class="ap" data-k="'+k+'" title="放回盤子">'+FE()+'</button>').join('')+'</div><div class="count">'+n+' 顆</div><button class="add" data-k="'+k+'"'+(st.tray?'':' disabled')+'>＋ 放一顆進來</button>';
  el.querySelector('.add').onclick=()=>{if(st.tray){st.tray--;st[k.toLowerCase()]++;render()}};
  el.querySelectorAll('.ap').forEach(b=>b.onclick=()=>{st[k.toLowerCase()]--;st.tray++;render()});
}
function boxGuess(k,name,n){
  const el=$('box'+k), other=st.open&&st.open!==k, shown=st.open===k||st.done;
  let inner='<h2>'+name+'</h2>';
  if(shown){inner+='<div class="apples">'+Array.from({length:n},()=>'<span class="ap">'+FE()+'</span>').join('')+'</div><div class="count"><b>'+n+'</b> 顆</div>'}
  else if(other){inner+='<div class="lid" style="cursor:default">📦❓<small>猜猜看有幾顆</small></div>'}
  else{inner+='<button class="lid">📦<small>點我打開</small></button>'}
  el.innerHTML=inner;
  const lid=el.querySelector('button.lid');
  if(lid)lid.onclick=()=>{st.open=k;st.pick=null;$('msg').textContent='';$('msg').className='msg';render()};
}
function drawPad(){
  const pad=$('pad');pad.innerHTML='';
  for(let i=0;i<=TOTAL;i++){const b=document.createElement('button');b.textContent=i;if(st.pick===i)b.className='sel';b.onclick=()=>{st.pick=i;drawPad()};pad.appendChild(b)}
  $('check').onclick=check;
}
function check(){
  const m=$('msg'), o=st.open==='A'?'b':'a', known=st[st.open.toLowerCase()], ans=st[o];
  if(st.pick===null){m.textContent='先選一個數字喔！';m.className='msg bad';return}
  if(st.pick===ans){st.done=true;m.textContent=PRAISE[pi++%PRAISE.length].split('{F}').join(FN()).split('{E}').join(FE());m.className='msg ok';render()}
  else{m.textContent='你一定是剛剛恐神了，再給你一次機會！';m.className='msg bad';st.pick=null;drawPad()}
}
function drawEq(){
  $('eq').innerHTML='<div class="row"><button class="big" id="again">換人再玩一次</button></div>';
  $('again').onclick=init;
}
function setTotal(n){TOTAL=Math.max(2,Math.min(20,n));init()}
$('minus').onclick=()=>setTotal(TOTAL-1);
$('plus').onclick=()=>setTotal(TOTAL+1);
$('reset').onclick=init;
init();

/* 國字加注音 */
const ZY='蘋ㄆㄧㄥˊ 果ㄍㄨㄛˇ 分ㄈㄣ 裝ㄓㄨㄤ 箱ㄒㄧㄤ 總ㄗㄨㄥˇ 數ㄕㄨˋ 顆ㄎㄜ 第ㄉㄧˋ 二ㄦˋ 位ㄨㄟˋ 小ㄒㄧㄠˇ 朋ㄆㄥˊ 友ㄧㄡˇ 把ㄅㄚˇ 到ㄉㄠˋ 兩ㄌㄧㄤˇ 個˙ㄍㄜ 子˙ㄗ 裡ㄌㄧˇ 想ㄒㄧㄤˇ 怎ㄗㄣˇ 麼˙ㄇㄜ 都ㄉㄡ 可ㄎㄜˇ 以ㄧˇ 另ㄌㄧㄥˋ 一ㄧ 幾ㄐㄧˇ 點ㄉㄧㄢˇ 打ㄉㄚˇ 開ㄎㄞ 來ㄌㄞˊ 看ㄎㄢˋ 盤ㄆㄢˊ 還ㄏㄞˊ 有ㄧㄡˇ 紅ㄏㄨㄥˊ 色ㄙㄜˋ 藍ㄌㄢˊ 放ㄈㄤˋ 進ㄐㄧㄣˋ 蓋ㄍㄞˋ 起ㄑㄧˇ 交ㄐㄧㄠ 給ㄍㄟˇ 下ㄒㄧㄚˋ 我ㄨㄛˇ 猜ㄘㄞ 確ㄑㄩㄝˋ 定ㄉㄧㄥˋ 先ㄒㄧㄢ 選ㄒㄩㄢˇ 字ㄗˋ 喔ㄛ 你ㄋㄧˇ 剛ㄍㄤ 恍ㄏㄨㄤˇ 神ㄕㄣˊ 了˙ㄌㄜ 再ㄗㄞˋ 機ㄐㄧ 會ㄏㄨㄟˋ 換ㄏㄨㄢˋ 人ㄖㄣˊ 玩ㄨㄢˊ 次ㄘˋ 重ㄔㄨㄥˊ 新ㄒㄧㄣ 始ㄕˇ 太ㄊㄞˋ 厲ㄌㄧˋ 害ㄏㄞˋ 是ㄕˋ 天ㄊㄧㄢ 才ㄘㄞˊ 哇ㄨㄚ 的˙ㄉㄜ 腦ㄋㄠˇ 袋ㄉㄞˋ 閃ㄕㄢˇ 發ㄈㄚ 光ㄍㄨㄤ 答ㄉㄚˊ 對ㄉㄨㄟˋ 囉˙ㄌㄨㄛ 送ㄙㄨㄥˋ 大ㄉㄚˋ 拇ㄇㄨˇ 指ㄓˇ 比ㄅㄧˇ 甜ㄊㄧㄢˊ 聰ㄘㄨㄥ 明ㄇㄧㄥˊ 偵ㄓㄣ 探ㄊㄢˋ 就ㄐㄧㄡˋ 好ㄏㄠˇ 棒ㄅㄤˋ 家ㄐㄧㄚ 鼓ㄍㄨˇ 掌ㄓㄤˇ 學ㄒㄩㄝˊ 超ㄔㄠ 出ㄔㄨ 現ㄒㄧㄢˋ 咻ㄒㄧㄡ 中ㄓㄨㄥ 今ㄐㄧㄣ 王ㄨㄤˊ 橘ㄐㄩˊ 芭ㄅㄚ 樂ㄌㄜˋ 葡ㄆㄨˊ 萄ㄊㄠˊ 水ㄕㄨㄟˇ';
const ZMAP={};ZY.split(' ').forEach(t=>ZMAP[t[0]]=t.slice(1));
const ZOV=[['第一位','ㄉㄧˋ ㄧ ㄨㄟˋ'],['一位','ㄧˊ ㄨㄟˋ'],['一個','ㄧˊ ˙ㄍㄜ'],['一顆','ㄧˋ ㄎㄜ'],['一次','ㄧˊ ㄘˋ'],['一定','ㄧˊ ㄉㄧㄥˋ'],['猜中','ㄘㄞ ㄓㄨㄥˋ']].map(([w,z])=>[w,z.split(' ')]);
const CJK=/[\u4e00-\u9fff]/;
function esc(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c}
function mk(c,z){const n=z[0]==='˙'?'˙':'',t=/[ˊˇˋ]$/.test(z)?z.slice(-1):'',l=z.replace(/[˙ˊˇˋ]/g,'');return '<span class="zc"><span class="zh">'+esc(c)+'</span><span class="zz"><span class="zn">'+n+'</span><span class="zl">'+l+'</span><span class="zt">'+t+'</span></span></span>'}
function conv(s){
  let out='',i=0;
  while(i<s.length){
    const ov=ZOV.find(([w])=>s.startsWith(w,i));
    if(ov){[...ov[0]].forEach((c,k)=>out+=mk(c,ov[1][k]));i+=ov[0].length;continue}
    const c=s[i];
    out+=(CJK.test(c)&&ZMAP[c])?mk(c,ZMAP[c]):esc(c);
    i++;
  }
  return out;
}
function zy(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>CJK.test(n.nodeValue)&&!n.parentNode.closest('.zc,script,style,title')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const f=document.createElement('span');f.innerHTML=conv(n.nodeValue);n.replaceWith(...f.childNodes)});
}
const MO_OPT={childList:true,subtree:true,characterData:true};
const mo=new MutationObserver(()=>{mo.disconnect();zy(document.body);mo.observe(document.body,MO_OPT)});
zy(document.body);
mo.observe(document.body,MO_OPT);
</script>
</body>
</html>
